name: pokecraft_api
services:
  mongo:
    image: mongo
    container_name: pokecraft_api_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: pokecraft
      MONGO_INITDB_ROOT_PASSWORD: FzPVUyGvNErn4Hsj
    ports:
      - 27042:27017
    volumes:
      - mongo_data:/data/db

  postgres:
    image: postgres
    container_name: pokecraft_api_postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: YSDPert8wW5mgkf4
    ports:
      - 5442:5432
    volumes:
      - postgres_data:/var/lib/postgresql

  rabbitmq:
    image: rabbitmq:4.3.5-management
    container_name: pokecraft_api_rabbitmq
    hostname: rabbitmq
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: pokegame
      RABBITMQ_DEFAULT_PASS: pokegame
      RABBITMQ_DEFAULT_VHOST: pokegame
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  cms:
    image: logitar/krakenar:v2.2.0
    container_name: pokecraft_api_cms
    depends_on:
      - mongo
      - postgres
    restart: unless-stopped
    environment:
      ASPNETCORE_Environment: Development
      AUTHENTICATION_ENABLE_AUTHENTICATED_EVENT_SOURCING: "false"
      DATABASE_PROVIDER: EntityFrameworkCorePostgreSQL
      MONGOCONNSTR_Krakenar: mongodb://pokecraft:FzPVUyGvNErn4Hsj@mongo:27017/
      POSTGRESQLCONNSTR_Krakenar: User ID=postgres;Password=YSDPert8wW5mgkf4;Host=postgres;Port=5432;Database=cms;
    ports:
      - 8892:8080

  api:
    build:
      context: .
      dockerfile: /src/PokeGame.Api/Dockerfile
    image: pokecraft_api
    container_name: pokecraft_api
    depends_on:
      - cms
      - rabbitmq
    restart: unless-stopped
    environment:
      ASPNETCORE_Environment: Development
      KRAKENAR_BASE_URL: http://cms:8080
      MONGOCONNSTR_Pokemon: mongodb://pokecraft:FzPVUyGvNErn4Hsj@mongo:27017/
      POSTGRESQLCONNSTR_Pokemon: User ID=postgres;Password=YSDPert8wW5mgkf4;Host=postgres;Port=5432;Database=api;
      RABBITMQ_HOST: rabbitmq
    ports:
      - 8092:8080
    volumes:
      - api_data:/data

volumes:
  api_data:
  mongo_data:
  postgres_data:
  rabbitmq_data:
